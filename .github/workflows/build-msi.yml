name: Compilar Instalador MSI (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar frontend
        run: npm run build

      - name: Compilar Instalador MSI con Tauri
        run: npx @tauri-apps/cli build --bundles msi --verbose

      - name: Subir instalador MSI
        uses: actions/upload-artifact@v4
        with:
          name: SI-Flows-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
